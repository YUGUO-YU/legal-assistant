server:
  port: 8080

spring:
  application:
    name: legal-assistant

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/legal_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:password}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.legal.assistant.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-change-in-production}
  expiration: 604800000
  refresh-expiration: 2592000000

sms:
  secret-id: ${SMS_SECRET_ID:}
  secret-key: ${SMS_SECRET_KEY:}
  app-id: ${SMS_APP_ID:}
  template-login: ${SMS_TEMPLATE_LOGIN:your-template-id}

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  bucket: ${COS_BUCKET:}
  region: ${COS_REGION:ap-guangzhou}

third-party:
  api-key: ${THIRD_PARTY_API_KEY:}

logging:
  level:
    com.legal.assistant: debug